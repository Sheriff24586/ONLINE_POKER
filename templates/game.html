<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <title>Room {{room_code}}</title>
  <link rel="stylesheet" href="/static/css/poker.css">
  <script src="/static/js/socket.io.min.js"></script>
</head>
<body>
  <div id="portrait">Rotate your device to landscape to play.</div>
  <section id="fullscreenPrompt" class="fullscreen-prompt" role="dialog" aria-modal="true" aria-labelledby="fullscreenTitle" hidden>
    <div class="fullscreen-card">
      <div class="fullscreen-icon" aria-hidden="true">⛶</div>
      <p class="fullscreen-eyebrow">POKER TABLE</p>
      <h1 id="fullscreenTitle">Play full screen</h1>
      <p id="fullscreenMessage">Hide the browser bars for more room at the table. Turn your phone sideways for the best view.</p>
      <button id="enterFullscreenBtn" class="fullscreen-primary">ENTER FULL SCREEN</button>
      <button id="continueWindowedBtn" class="fullscreen-secondary">CONTINUE WITHOUT IT</button>
    </div>
  </section>
  <main class="game">
    <header class="game-header">
      <div class="brand mini game-brand">♠ <span>POKER</span><small>PRIVATE TABLE</small></div>
      <div class="room-overview">
        <span class="live-indicator" aria-hidden="true"></span>
        <span class="room-label">ROOM</span>
        <b id="roomcode">{{room_code}}</b>
        <span class="room-divider" aria-hidden="true"></span>
        <span id="players">0/10 players</span>
      </div>
      <div class="header-actions">
        <button id="fullscreenToggle" class="tiny fullscreen-toggle" aria-label="Enter full screen" title="Enter full screen">⛶</button>
        <button id="soundToggle" class="tiny sound-toggle" aria-label="Mute music and game sounds" title="Mute music and game sounds">🔊</button>
        <button id="newSessionBtn" class="danger hidden">NEW SESSION</button>
        <button id="exitBtn" class="tiny">EXIT</button>
      </div>
    </header>
    <section class="table-wrap">
      <div class="table-shell">
        <div class="felt">
          <div class="pot" id="pot">POT 0</div>
          <div class="card-deck" id="cardDeck" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="community" id="board"></div>
          <div id="seats"></div>
          <div class="center-status" id="status"></div>
        </div>
      </div>
    </section>
    <section class="controls">
      <div class="game-details" aria-live="polite">
        <div class="detail"><span>STREET</span><strong id="stage">WAITING</strong></div>
        <div class="detail"><span>CURRENT BET</span><strong id="current-bet">0</strong></div>
        <div class="detail"><span>TURN</span><strong id="turn">Waiting for players</strong></div>
      </div>
      <div class="history-controls">
        <button id="undoBtn" class="secondary" disabled>UNDO</button>
        <button id="redoBtn" class="secondary" disabled>REDO</button>
      </div>
      <div class="session-controls">
        <button id="newHandBtn" class="primary hidden">NEW HAND</button>
      </div>
      <div id="actions" class="actions hidden">
        <button class="action-fold" data-action="fold" aria-label="Fold"><span aria-hidden="true">❌</span> FOLD</button>
        <button class="action-check" data-action="check" aria-label="Check"><span aria-hidden="true">✓</span> CHECK</button>
        <button class="action-call" data-action="call" aria-label="Call"><span aria-hidden="true">↔</span> CALL</button>
        <input id="raise" type="number" min="1" placeholder="Raise to">
        <button id="raiseBtn" class="action-raise" aria-label="Raise"><span aria-hidden="true">⬆</span> RAISE</button>
        <button class="action-allin" data-action="allin" aria-label="All-in"><span aria-hidden="true">⚡</span> ALL-IN</button>
      </div>
      <details id="historyPanel" class="history-panel">
        <summary>Action history</summary>
        <ol id="actionHistory"></ol>
      </details>
    </section>
  </main>
  <script>window.ROOM_CODE={{room_code|tojson}};</script>
  <script src="/static/js/game.js"></script>
</body>
</html>
